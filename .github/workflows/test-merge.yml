name: Test Merge Commit
on: pull_request

permissions:
  contents: read

jobs:
  test-merge:
    runs-on: ${{ matrix.config.os }}
    permissions:
      contents: read
      # Lets codecov-action authenticate with OIDC instead of a stored token
      id-token: write
    strategy:
      matrix:
        config:
          # arch isn't used and we have no way to use it currently
          - { os: macos-latest, arch: x64 }
          - { os: ubuntu-latest, arch: x64 }
          - { os: windows-latest, arch: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm test
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          disable_search: true
          # lcov.info is the whole report; don't let the uploader run gcov/xcode/coverage.py itself
          plugins: noop
          # OIDC isn't available to pull requests from forks; those upload tokenless instead
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
