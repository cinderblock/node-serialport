name: Test / Lint
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: 14
      - run: npm ci
      - run: npm run lint
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        node-version: [10.x, 12.x, 14.x, 16.x]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - run: echo color = always > ~/.npmrc

      # Install needed extra tooling
      - run: choco install OpenCppCoverage

      - uses: suisei-cn/actions-download-file@v1
        # id: com0com
        name: Download Official com0com installer
        with:
          url: 'https://downloads.sourceforge.net/project/com0com/com0com/3.0.0.0/com0com-3.0.0.0-i386-and-x64-signed.zip'
      - name: Extract com0com installer
        run: 7z x com0com-3.0.0.0-i386-and-x64-signed.zip *_x64_signed.exe
      - name: Extract com0com setup to install manually
        run: 7z x Setup_com0com_v3.0.0.0_W7_x64_signed.exe -ocom0com

        # Manual com0com install because the installer only works with a GUI
      - name: com0com preinstall
        timeout-minutes: 1
        working-directory: com0com
        run: |
          ./setupc.exe preinstall
          ./setupc.exe update
          ./setupc.exe infclean
      - name: com0com setup CNCA0 <-> CNCB0
        timeout-minutes: 1
        working-directory: com0com
        run: ./setupc.exe install 0 - -
      - name: com0com setup COM# <-> COM#
        timeout-minutes: 1
        working-directory: com0com
        run: ./setupc.exe install PortName=COM# PortName=COM#

        env:
          CNC_INSTALL_COMX_COMX_PORTS: YES
          CNC_INSTALL_CNCA0_CNCB0_PORTS: YES
          CNC_INSTALL_START_MENU_SHORTCUTS: NO

      - run: npm ci

      # Rebuild the project with coverage instrumentation
      - run: npm run rebuild -- -- --debug

      # Run tests and generate coverage report
      - name: Run npm test with coverage
        timeout-minutes: 1
        run: |
          C:\Progra~1\OpenCppCoverage\OpenCppCoverage.exe --quiet --cover_children --modules "*.node" --source "packages\bindings\src\*" --export_type=cobertura:coverage/cpp.xml -- C:\Progra~1\nodejs\npm.cmd test -- --color
        env:
          CI: true
          TEST_PORT: COM2

      # Publish coverage information to codecov.io
      - run: npm run coverage:publish:windows
      - run: npm run coverage:publish:node

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        node-version: [10.x, 12.x, 14.x, 16.x]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - run: echo color = always > ~/.npmrc

      # Install needed extra tooling
      # lcov, needed to:
      # - convert coverage in gcov format to lcov format
      # - remove coverage data of external files (v8.h, etc.)
      # socat, needed to emulate a serial port to test against
      - run: sudo apt-get install -y lcov socat

      - run: npm ci

      # Rebuild the project with coverage instrumentation
      - run: npm run rebuild
        env:
          # Enable gcov in binaries
          GENERATE_COVERAGE: yes

      - name: Simulate a loopback device at /dev/loopback
        # User `cat` to echo back all bytes received. There's probably a better way to do this.
        run: sudo socat -d -d pty,link=/dev/loopback,raw,user=runner,crtscts=1 "system:(while sleep 0.01; do echo -n READY; done & cat)" &
      - name: Ensure /dev/loopback exists
        # Make sure the loopback device exists so that tests don't fail later
        run: ls -l /dev/loopback

      # Run tests and generate coverage report
      - run: npm test -- --color
        timeout-minutes: 1
        env:
          CI: true
          TEST_PORT: /dev/loopback
      - name: Convert gcov `gcda` coverage information to lcov format
        run: npm run coverage:lcov

      # Publish coverage information to codecov.io
      - run: npm run coverage:publish:lcov
      - run: npm run coverage:publish:node

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: [10.x, 12.x, 14.x, 16.x]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - run: echo color = always > ~/.npmrc

      # Install needed extra tooling
      # lcov, needed to:
      # - convert coverage in gcov format to lcov format
      # - remove coverage data of external files (v8.h, etc.)
      # socat, needed to emulate a serial port to test against
      - run: brew install lcov socat

      - run: npm ci
      # Rebuild the project with coverage instrumentation
      - run: npm run rebuild
        env:
          # Enable gcov in binaries
          GENERATE_COVERAGE: yes

      - name: Simulate a loopback device at /tmp/loopback
        # User `cat` to echo back all bytes received. There's probably a better way to do this.
        run: sudo socat -d -d pty,link=/tmp/loopback,raw,user=runner,crtscts=1 "system:(while sleep 0.5; do echo -n READY; done & cat)" &
      - name: Ensure /tmp/loopback exists
        # Make sure the loopback device exists so that tests don't fail later
        run: ls -l /tmp/loopback

      # Run tests and generate coverage report
      - run: npm test -- --color
        timeout-minutes: 1
        env:
          CI: true
          TEST_PORT: /tmp/loopback
      - name: Convert gcov `gcda` coverage information to lcov format
        run: npm run coverage:lcov

      # Publish coverage information to codecov.io
      - run: npm run coverage:publish:lcov
      - run: npm run coverage:publish:node
