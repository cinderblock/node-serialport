name: Test / Lint
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: 14
      - run: npm ci
      - run: npm run lint
  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [10.x, 12.x, 14.x, 16.x]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      # Install needed extra tooling
      - run: |
          choco install OpenCppCoverage
          npm install npm@7
        # choco install com0com

      - uses: suisei-cn/actions-download-file@v1
        # id: com0com
        name: Download Official com0com installer
        with:
          url: 'https://pilotfiber.dl.sourceforge.net/project/com0com/com0com/3.0.0.0/com0com-3.0.0.0-i386-and-x64-signed.zip'
          target: com0com/
      - name: Extract com0com installer
        run: 7z x com0com/com0com-3.0.0.0-i386-and-x64-signed.zip -ocom0com *_x64_signed.exe
      - name: Run com0com setup
        run: com0com/Setup_com0com_v3.0.0.0_W7_x64_signed.exe /S
        env:
          CNC_INSTALL_COMX_COMX_PORTS: YES

      - run: npm ci

      # Rebuild the project with coverage instrumentation
      - run: npm run rebuild -- -- --debug

      # Run tests and generate coverage report
      - run: npm run coverage:windows -- --color
        env:
          CI: true
          TEST_PORT: COM2

      # Publish coverage information to codecov.io
      - run: npm run coverage:publish:windows
      - run: npm run coverage:publish:node

  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [10.x, 12.x, 14.x, 16.x]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      # Install needed extra tooling

      # Needed to convert coverage in gcov format to lcov format and cleanup
      - run: sudo apt-get install -y lcov socat

      - run: npm ci

      # Rebuild the project with coverage instrumentation
      - run: npm run rebuild
        env:
          # Enable gcov in binaries
          GENERATE_COVERAGE: yes

      - name: Simulate a loopback device at /dev/loopback
        # User `cat` to echo back all bytes received. There's probably a better way to do this.
        run: sudo socat pty,link=/dev/loopback,raw,user=runner,crtscts=1 "system:(while sleep 0.01; do echo -n READY; done & cat)" &
      - name: Ensure /dev/loopback exists
        # Make sure the loopback device exists so that tests don't fail later
        run: ls -l /dev/loopback

      # Run tests and generate coverage report

      - run: npm test -- --color
        env:
          CI: true
          TEST_PORT: /dev/loopback
      - name: Convert gcov `gcda` coverage information to lcov format
        run: npm run coverage:lcov

      # Publish coverage information to codecov.io
      - run: npm run coverage:publish:lcov
      - run: npm run coverage:publish:node

  test-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [10.x, 12.x, 14.x, 16.x]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      # Install needed extra tooling
      - run: brew install lcov socat

      - run: npm ci
      # Rebuild the project with coverage instrumentation
      - run: npm run rebuild
        env:
          # Enable gcov in binaries
          GENERATE_COVERAGE: yes

      # Run tests and generate coverage report

      - name: Simulate a loopback device at /tmp/loopback
        # User `cat` to echo back all bytes received. There's probably a better way to do this.
        run: sudo socat pty,link=/tmp/loopback,raw,user=runner,crtscts=1 "system:(while sleep 0.01; do echo -n READY; done & cat)" &
      - name: Ensure /tmp/loopback exists
        # Make sure the loopback device exists so that tests don't fail later
        run: ls -l /tmp/loopback

      - run: npm test -- --color
        env:
          CI: true
          TEST_PORT: /tmp/loopback
      - name: Convert gcov `gcda` coverage information to lcov format
        run: npm run coverage:lcov

      # Publish coverage information to codecov.io
      - run: npm run coverage:publish:lcov
      - run: npm run coverage:publish:node
