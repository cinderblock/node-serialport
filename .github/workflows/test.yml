name: Test / Lint
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: 14
      - run: npm ci
      - run: npm run lint
  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [10.x, 12.x, 14.x, 16.x]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      # Install needed extra tooling
      - run: |
          choco install OpenCppCoverage
          npm install npm@7
        # choco install com0com

      - uses: suisei-cn/actions-download-file@v1
        # id: com0com
        name: Download com0com installer
        with:
          url: 'https://pilotfiber.dl.sourceforge.net/project/com0com/com0com/3.0.0.0/com0com-3.0.0.0-i386-and-x64-signed.zip'
          target: com0com/
      - run: 7z x com0com/com0com-3.0.0.0-i386-and-x64-signed.zip
      - run: com0com/Setup_com0com_v3.0.0.0_W7_x64_signed.exe

      - run: npm ci

      # Rebuild the project with coverage instrumentation
      - run: npm run rebuild -- -- --debug

      # Run tests and generate coverage report
      - run: npm run coverage:windows
        env:
          CI: true
          TEST_PORT: COM0

      # Publish coverage information to codecov.io
      - run: npm run coverage:publish:windows
      - run: npm run coverage:publish:node

  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [10.x, 12.x, 14.x, 16.x]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      # Install needed extra tooling

      # Needed to convert coverage in gcov format to lcov format and cleanup
      - run: sudo apt-get install -y lcov socat

      - name: Simulate a loopback device at /dev/loopback
        run: sudo socat pty,link=/dev/loopback,raw,user=runner pty,link=/dev/loopback,raw,user=runner &

      - run: npm ci

      # Rebuild the project with coverage instrumentation
      - run: npm run rebuild
        env:
          # Enable gcov in binaries
          GENERATE_COVERAGE: yes

      # Run tests and generate coverage report

      # Convert gcov `gcda` coverage information to lcov format.
      - run: |
          npm test
          npm run coverage:lcov
        env:
          CI: true
          TEST_PORT: /dev/loopback

      # Publish coverage information to codecov.io
      - run: npm run coverage:publish:lcov
      - run: npm run coverage:publish:node

  test-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [10.x, 12.x, 14.x, 16.x]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      # Install needed extra tooling
      - run: brew install lcov socat

      - name: Simulate a loopback device at /tmp/loopback
        # Works as long as loopback_ is not opened for some reason...
        run: sudo socat pty,link=/tmp/loopback,raw,user=runner pty,link=/tmp/loopback,raw,user=runner &

      # DEBUG: Make sure it's still there
      - run: sudo ls -Ll /tmp/loopback
      - run: whoami

      - run: npm ci
      # Rebuild the project with coverage instrumentation
      - run: npm run rebuild
        env:
          # Enable gcov in binaries
          GENERATE_COVERAGE: yes

      # Run tests and generate coverage report

      # Convert gcov `gcda` coverage information to lcov format.
      - run: |
          npm test
          npm run coverage:lcov
        env:
          CI: true
          TEST_PORT: /tmp/loopback

      # Publish coverage information to codecov.io
      - run: npm run coverage:publish:lcov
      - run: npm run coverage:publish:node
