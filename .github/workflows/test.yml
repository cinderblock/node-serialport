name: Test / Lint
on:
  push:
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  test:
    runs-on: ${{ matrix.config.os }}
    permissions:
      contents: read
      # Lets codecov-action authenticate with OIDC instead of a stored token
      id-token: write
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        config:
          - { os: macos-latest }
          - { os: ubuntu-latest }
          - { os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          disable_search: true
          use_oidc: true
